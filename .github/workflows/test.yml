on:
  push:
    branches:
      - test
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: jupacsoftware.eu
          username: jupacsoftw
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: www/test/
